<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download ZIP</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --shadow: 0 24px 60px rgba(3, 10, 18, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(56, 139, 253, 0.16), transparent 35%),
                  radial-gradient(circle at bottom right, rgba(88, 166, 255, 0.12), transparent 24%),
                  linear-gradient(180deg, #020409 0%, #0b1220 100%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: min(520px, calc(100vw - 32px));
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.9rem, 2.5vw, 2.8rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.7;
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1.2rem;
      border-radius: 999px;
      background: rgba(56, 139, 253, 0.14);
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 24px;
    }

    .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.95rem 1.6rem;
      border-radius: 999px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, #58a6ff 0%, #1f6feb 100%);
      color: white;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .download-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(40, 90, 161, 0.24);
      background: linear-gradient(135deg, #79b8ff 0%, #3294ff 100%);
    }

    .footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const fileName = 'ML.zip';
      const link = document.createElement('a');
      link.href = fileName;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="status">Preparing your download...</div>
    <h1>Your ZIP file is ready</h1>
    <p>The download should begin automatically. If it doesn’t, you can manually start it by clicking the button below.</p>
    <a class="download-link" href="ML.zip" download>
      Download ML.zip
    </a>
    <div class="footer">Thanks for using the download page.</div>
  </div>
</body>
</html>
